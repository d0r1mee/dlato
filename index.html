<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Другие цвета — Эпизод 1: Колбочки</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="objective"></div>
    <div id="vision-label"></div>
    <div id="crosshair"></div>
    <div id="prompt"></div>
    <div id="toast"></div>
  </div>

  <div id="dialogue" class="hidden">
    <div id="dlg-name"></div>
    <div id="dlg-text"></div>
    <div id="dlg-choices"></div>
    <div id="dlg-hint">ЛКМ / Пробел — далее</div>
  </div>

  <div id="panel" class="hidden"></div>

  <div id="fade"></div>

  <div id="screen-title" class="screen">
    <div class="screen-inner">
      <h1>Другие цвета</h1>
      <h2>Эпизод 1. Колбочки</h2>
      <p class="note">Игра о том, как видят мир люди с нарушениями цветовосприятия.<br />
        Всё, что вы видите, проходит через «глаза» героя — пост-обработку камеры.</p>
      <button id="btn-start">Начать</button>
      <p class="controls">WASD — ходить · Мышь — смотреть · E — взаимодействовать · Esc — пауза</p>
    </div>
  </div>

  <div id="screen-pause" class="screen hidden">
    <div class="screen-inner">
      <h2>Пауза</h2>
      <button id="btn-resume">Продолжить</button>
      <label class="setting">Чувствительность мыши
        <input id="opt-sens" type="range" min="0.3" max="3" step="0.1" value="1" />
      </label>
    </div>
  </div>

  <div id="screen-end" class="screen hidden">
    <div class="screen-inner">
      <h2>Конец первого эпизода</h2>
      <div id="end-text"></div>
      <button id="btn-sim">Свободный режим: симулятор зрения</button>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
